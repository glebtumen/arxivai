services:
  postgres:
    image: postgres:16-alpine
    container_name: archivebot_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - archivebot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  backend:
    build: ./backend
    container_name: archivebot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage/media:/storage/media
      - ./backend/instagram_cookies.txt:/backend/instagram_cookies.txt

  web:
    build:
      context: ./web
      args:
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: archivebot_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    ports:
      - "3000:3000"

  bot:
    build: ./bot
    container_name: archivebot_bot
    restart: unless-stopped
    env_file:
      - .env

volumes:
  archivebot_pgdata:
