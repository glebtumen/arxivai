services:
  postgres:
    image: postgres:16-alpine
    container_name: archivebot_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - archivebot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  proxy:
    image: nginx:alpine
    container_name: archivebot_proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: archivebot_certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

  backend:
    build: ./backend
    container_name: archivebot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    volumes:
      - ./storage/media:/storage/media
      - ./backend/instagram_cookies.txt:/backend/instagram_cookies.txt

  web:
    build:
      context: ./web
      args:
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: archivebot_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

  bot:
    build: ./bot
    container_name: archivebot_bot
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: archivebot_redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    volumes:
      - archivebot_redisdata:/data

  worker:
    build: ./backend
    container_name: archivebot_worker
    restart: unless-stopped
    command: rq worker -u redis://redis:6379/0 items
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./storage/media:/storage/media
      - ./backend/instagram_cookies.txt:/backend/instagram_cookies.txt

volumes:
  archivebot_pgdata:
  archivebot_redisdata:

