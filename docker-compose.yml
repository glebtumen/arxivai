version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: archivebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archivebot
      POSTGRES_PASSWORD: archivebot
      POSTGRES_DB: archivebot
    ports:
      - "5432:5432"
    volumes:
      - archivebot_pgdata:/var/lib/postgresql/data

volumes:
  archivebot_pgdata:
